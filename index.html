<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Visit Records</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<style>
/* darker table lines, and a thick line where a new shed starts */
.tablewrap td,.tablewrap th{border:1.5px solid #000 !important}
.tablewrap tr.shedstart td{border-top:4px solid #000 !important}
/* table heading stays on screen while the rows are scrolled */
.tablewrap{max-height:75vh;overflow:auto}
.tablewrap thead th{position:sticky;top:0;z-index:2;background:var(--card,#fff);box-shadow:0 1px 0 var(--line,#d9dde3)}


:root{--bg:#f5f6f8;--card:#fff;--text:#1d232b;--muted:#6b7480;--line:#d9dde3;--accent:#2f6fdb;--head:#fbe3cf;--red:#c62828;--calc:#f3f4f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181d;--card:#1f242b;--text:#e8ebef;--muted:#9aa3ae;--line:#38404a;--accent:#6ea3ff;--head:#4a3a2c;--red:#ef5350;--calc:#262c34}}
:root[data-theme="dark"]{--bg:#15181d;--card:#1f242b;--text:#e8ebef;--muted:#9aa3ae;--line:#38404a;--accent:#6ea3ff;--head:#4a3a2c;--red:#ef5350;--calc:#262c34}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line);z-index:5}
header h1{margin:0;padding:12px 16px 4px;font-size:17px}
nav{display:flex;gap:6px;padding:6px 12px 10px;overflow-x:auto}
main{padding:16px;max-width:1280px;margin:0 auto}
button{font:inherit;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:8px 14px;border-radius:8px;white-space:nowrap}
button.primary,button.active{background:var(--accent);color:#fff}
button.danger{border-color:var(--red);color:var(--red);padding:3px 8px}
button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:13px}
.menu{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}
.menu button{padding:14px 18px;font-size:16px;min-width:140px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px;min-width:150px}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.formgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:1500px;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap;vertical-align:middle}
th{background:var(--head);color:#222;font-weight:600}
th.calc{background:var(--red);color:#fff}
td.farm{background:var(--card);font-weight:600;text-align:left;min-width:150px;white-space:normal}
td.calc{background:var(--calc);font-weight:600}
td.txt{text-align:left;white-space:normal;min-width:130px}
.muted{color:var(--muted);font-size:13px}
.listrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}
.preview{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.preview div{font-size:13px;color:var(--muted)}
.preview b{display:block;font-size:16px;color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
h2{font-size:18px;margin:6px 0 12px}
</style>
</head>
<body>
<header>
  <h1>Farm Visit Records</h1>
  <nav>
    <button data-nav="home">Home</button>
    <button data-nav="farm">Farm Visit</button>
    <button data-nav="summary">View Sheet</button>
    <button data-nav="model">Model Farm</button>
    <button data-nav="rx">E-Prescription</button>
    <button data-nav="daily">Daily Report</button>

  </nav>
</header>
<main id="app"><p class="muted">Loading...</p></main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(Number(v))) ? null : Number(v);
const today = () => new Date().toISOString().slice(0, 10);
const thisMonth = () => today().slice(0, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = (x, d) => x == null || !isFinite(x) ? '-' : x.toFixed(d);
const TYPES = {layer:'Layer', broiler:'Broiler', colorbird:'Color Bird / Sonali'};

const FARM_FIELDS = [
  ['name','Farmer Name','text'], ['address','Address','text'], ['mobile','Mobile','tel'],
  ['feedBrand','Feed Brand','text']
, ['docDate','Doc Input Date (dd-mm-yyyy)','text']
];
const VISIT_FIELDS = [
  ['shed','Shed (e.g. Shed 1)','text'], ['chickBrand','Chick Brand','text'], ['breed','Breed','text'], ['dateText','Visit Date (dd-mm-yyyy)','text'], ['gapDays','Days Since Last Visit','number'], ['ageWeeks','Age (Weeks)','number'], ['ageDays','Age (Days, optional)','number'], ['chicks','Number of Chicks','number'],
  ['mortality','Mortality','number'], ['bodyWeight','Avg. Body Weight (kg)','number'], ['totalFeed','Total Feed Intake (bags, 50 kg each)','number'],
  ['dailyFeed','Daily Feed Intake (kg)','number'], ['eggs','Number of Eggs','number'], ['eggWeight','Avg. Egg Weight (g)','number'],
  ['h5n1','H5N1 (Killed) (Before Day)','number'], ['h9n2','H9N2 / H9N2 + ND (Before Day)','number'], ['deworming','Deworming (Before Day)','number'], ['karyza','Coryza / Salmonella (Before Day)','number'], ['ndOblique','Live Vaccine (ND / ND+IB) (Before Day)','number'], ['otherVaccine','Other Vaccine (Name + Day)','text'], ['prevMedicine','Previous Medicine Used','text'], ['problem','Problem & Comment','text'], ['suggestedMedicine','Suggested Medicine','text'], ['dealer','From Which Dealer','text'], ['model','Model Farm? (Yes/No)','select']
];

let state = {trSel:{}, mdPick:{}, trash:[], fSearch:'', fMode:null, fForm:null, repEdit:false, listTab:'dealer', dlMode:null, dlForm:null, repDate:'', reportText:null, rxLogo:'', rxList:[], rxView:false, mf:{type:'all', feed:'all', farm:'all', period:'all', from:'', to:'', order:'Haid'}, trackEdit:null, trackForm:{}, modelEdit:false, photos:[], photoView:null, brType:'broiler', vs:{period:'all', month:thisMonth(), year:today().slice(0,4), weekStart:mondayOf(today()), type:'all'}, brmode:'list', brFarmId:null, brBatchId:null, brForm:{}, brVisitIdx:null, brAuto:true, brShowDone:false, brSearch:'', shedFilter:'all', pendingFarmDel:null, listFilter:'all', view:'home', farmType:'layer', farms:[], farmId:null, mode:'list', form:null, visitIdx:null, sumMonth:thisMonth(), filterFarm:'all'};
/* ---- Connection to Google Sheets through your Apps Script web app (paste your URL here) ---- */
const API_URL = 'https://script.google.com/macros/s/AKfycbzJVzLgHLyssDs3eIbOlKbqjcCOL4y7BxjMVP9k1QtAnrCqPKsiCbgg50nuuQIaOkmI/exec';
let pin = localStorage.getItem('farmPin') || '';
async function remoteList(){
  if (!pin) throw new Error('NEED_PIN');
  const r = await withTimeout(fetch(`${API_URL}?action=list&pin=${encodeURIComponent(pin)}`));
  const j = await r.json();
  if (!j.ok){ localStorage.removeItem('farmPin'); pin = ''; throw new Error(j.error); }
  localStorage.setItem('farmPin', pin);
  return j.farms;
}
async function remoteCall(body){
  body.pin = pin;
  const r = await withTimeout(fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)}));
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j;
}
let store = {kind:'local'}, uid = null, dl = null;

/* ---------- Calculations ---------- */
function calc(v){
  const chicks = num(v.chicks), mort = num(v.mortality) || 0, eggs = num(v.eggs), w = num(v.eggWeight);
  const alive = chicks != null ? chicks - mort : null;
  const feedKg = num(v.dailyFeed);                                               // daily feed in kg
  const avgFeed = (alive > 0 && feedKg != null) ? feedKg * 1000 / alive : null;  // g per bird
  const rate = (alive > 0 && eggs != null) ? eggs / alive * 100 : null;          // %
  const eggKg = (eggs != null && w) ? eggs * w / 1000 : null;
  const ratio = (feedKg != null && eggKg) ? feedKg / eggKg : null;
  return {avgFeed, rate, ratio, feedKg};
}

const shedOf = v => (v.shed || '').trim() || 'Shed 1';
function lastVisitOf(f, shed){
  const vs = (f && f.visits || []).filter(v => shedOf(v) === shed);
  return vs.length ? vs[vs.length - 1] : {};
}
/* weeks shown with 2 decimals only */
const wk2 = x => (x == null || x === '' || isNaN(Number(x))) ? (x == null ? '' : x) : Math.round(Number(x) * 100) / 100;
function prefillFrom(v){
  if (!v || !v.date) return {};
  const keys = ['ageWeeks','model','chicks','mortality','bodyWeight','totalFeed','dailyFeed','eggs','eggWeight','deworming','h5n1','h9n2','h9nd','karyza',
    'ndOblique','ntIb','otherVaccine','prevMedicine','problem','suggestedMedicine','dealer'];
  const out = {};
  keys.forEach(k => { out[k] = v[k] ?? (k === 'mortality' ? 0 : (k === 'problem' ? 'No' : '')); });
  if (out.prevMedicine === '' && v.medicine) out.prevMedicine = v.medicine;
  return out;
}
function setDom(sel, val){ const el = document.querySelector(sel); if (el && el !== document.activeElement) el.value = val; }
/* Layer: the days since the last visit move the date, the age (weeks) and the 'Before Day' vaccine days */
function layerPrev(){ return lastVisitOf(curFarm(), state.form.shed); }
function layerApplyGap(){
  const pv = layerPrev(), gap = num(state.form.gapDays);
  if (!pv.date || gap == null) return;
  const pa = num(pv.ageWeeks);
  if (pa != null){ state.form.ageWeeks = String(+(pa + gap / 7).toFixed(1)); setDom('[data-vk="ageWeeks"]', state.form.ageWeeks); }
  ['h5n1','h9n2','deworming','karyza','ndOblique'].forEach(k => {
    const d = num(pv[k]);
    if (d != null){ state.form[k] = String(d + gap); setDom(`[data-vk="${k}"]`, state.form[k]); }
  });
  updatePreview();
}
function layerGapFromDate(){
  const pv = layerPrev();
  if (!pv.date || !state.form.date) return;
  state.form.gapDays = String(Math.round((Date.parse(state.form.date) - Date.parse(pv.date)) / 864e5));
  setDom('[data-vk="gapDays"]', state.form.gapDays);
  layerApplyGap();
}
function layerGapFromGap(){
  const pv = layerPrev(), gap = num(state.form.gapDays);
  if (!pv.date || gap == null) return;
  state.form.date = addDays(pv.date, gap); state.form.dateText = fmtDMY(state.form.date);
  setDom('[data-vk="dateText"]', state.form.dateText);
  layerApplyGap();
}
/* Broiler: the days since the last visit move the date and the age (days) */
function brPrev(){ const b = brBatchOf(brFarmOf()); return (b && b.visits.slice(-1)[0]) || {}; }
function brGapFromDate(){
  const pv = brPrev();
  if (!pv.date || !state.brForm.date) return;
  state.brForm.gapDays = String(Math.round((Date.parse(state.brForm.date) - Date.parse(pv.date)) / 864e5));
  setDom('[data-brv="gapDays"]', state.brForm.gapDays);
  brApplyGap();
}
function brGapFromGap(){
  const pv = brPrev(), gap = num(state.brForm.gapDays);
  if (!pv.date || gap == null) return;
  state.brForm.date = addDays(pv.date, gap); state.brForm.dateText = fmtDMY(state.brForm.date);
  setDom('[data-brv="dateText"]', state.brForm.dateText);
  brApplyGap();
}
function brApplyGap(){
  const pv = brPrev(), gap = num(state.brForm.gapDays), pa = num(pv.age);
  if (gap == null || pa == null) return;
  state.brForm.age = String(pa + gap); setDom('[data-brv="age"]', state.brForm.age);
  brUpdatePreview();
}
function prefillBr(v){
  return {age: v.age ?? '', model: v.model ?? '', mortality: v.mortality ?? 0, totalBag: v.totalBag ?? '', totalKg: v.totalKg ?? '', avgW: v.avgW ?? '',
    bv1: v.bv1 ?? '', bv2: v.bv2 ?? '', bv3: v.bv3 ?? '', bv4: v.bv4 ?? '', problem: v.problem ?? 'No', dealer: v.dealer ?? ''};
}
function shedInfoOf(f, shed){
  const si = (f.shedInfo || {})[shed];
  if (si) return si;
  const v = (f.visits || []).find(x => shedOf(x) === shed && (x.chickBrand || x.breed));
  if (v) return {chickBrand: v.chickBrand || '', breed: v.breed || ''};
  return {chickBrand: f.chickBrand || '', breed: f.breed || ''};   // older farms
}
function applyShedInfo(f, v){
  v.shed = shedOf(v);
  f.shedInfo = f.shedInfo || {};
  // the first visit of a shed that has chick brand or breed fixes them for that shed
  if (!f.shedInfo[v.shed] && ((v.chickBrand || '').trim() || (v.breed || '').trim()))
    f.shedInfo[v.shed] = {chickBrand: (v.chickBrand || '').trim(), breed: (v.breed || '').trim()};
}
function prevPanel(title, items){
  return `<div class="card" style="margin-bottom:12px;background:rgba(47,111,219,.06)"><b>${esc(title)}</b>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:8px">
    ${items.map(([l,v]) => `<div><span class="muted" style="font-size:12px">${esc(l)}</span><div><b>${esc(v ?? '') || '-'}</b></div></div>`).join('')}
    </div></div>`;
}
function prevLayerHTML(){
  const f = curFarm(), sh = state.form.shed, pv = lastVisitOf(f, sh);
  const info = shedInfoOf(f, sh);
  if (!pv.date) return prevPanel('Previous visit', [['Farmer Name', f.name], ['Address', f.address], ['Mobile No', f.mobile], ['Feed Brand', f.feedBrand], ['Shed', sh], ['Chick Brand', info.chickBrand], ['Breed', info.breed]]);
  return prevPanel('Previous visit: ' + fmtDMY(pv.date), [
    ['Farmer Name', f.name], ['Address', f.address], ['Mobile No', f.mobile], ['Feed Brand', f.feedBrand],
    ['Shed', sh], ['Chick Brand', info.chickBrand], ['Breed', info.breed], ['Visit Date', fmtDMY(pv.date)],
    ['Age (Weeks)', pv.ageWeeks], ['Number of Chicks', pv.chicks], ['Mortality', pv.mortality], ['Avg. Body Weight (kg)', pv.bodyWeight],
    ['Total Feed Intake (bags)', pv.totalFeed], ['Daily Feed Intake (kg)', pv.dailyFeed], ['Number of Eggs', pv.eggs], ['Avg. Egg Weight (g)', pv.eggWeight],
    ['H5N1 (Killed) (Before Day)', pv.h5n1], ['H9N2 (Killed) (Before Day)', pv.h9n2], ['H9N2 + ND (Before Day)', pv.h9nd],
    ['Deworming (Before Day)', pv.deworming], ['Coryza / Salmonella (Before Day)', pv.karyza],
    ['Live Vaccine (ND / ND+IB) (Before Day)', pv.ndOblique], ['NT + IB Live (Before Day)', pv.ntIb], ['Other Vaccine (Name + Day)', pv.otherVaccine],
    ['Previous Medicine Used', pv.prevMedicine ?? pv.medicine], ['Problem & Comment', pv.problem],
    ['Suggested Medicine', pv.suggestedMedicine], ['From Which Dealer', pv.dealer]]);
}
function prevBrHTML(b){
  const vs = b.visits || [], pv = vs[vs.length - 1];
  const before = vs.slice(0, -1).reduce((n,v) => n + (num(v.mortality) || 0), 0);
  const live = pv ? brCalc(b, pv, before).live : null;
  const f = brFarmOf();
  const head = [['Farmer Name', f.name], ['Address', f.address], ['Mobile No', f.mobile], ['Batch', b.name], ['DOC Brand', b.docBrand], ['Feed Brand', b.feedBrand], ['Flock Size (Pcs)', b.flock]];
  if (!pv) return prevPanel('Previous visit', head);
  return prevPanel('Previous visit: ' + fmtDMY(pv.date), head.concat([
    ['Visit Date', fmtDMY(pv.date)], ['Mortality', pv.mortality], ['Live Birds', live ?? ''], ['Age (Days)', pv.age],
    ['Total Feed Intake (bag)', pv.totalBag], ['Total Feed Intake (kg)', pv.totalKg], ['Avg. Body Weight (g)', pv.avgW],
    ['Problem', pv.problem], ['Dealer Name', pv.dealer]]));
}
function visitFieldState(k){
  const f = curFarm(), sh = state.form.shed;
  const known = !!(f && f.shedInfo && f.shedInfo[sh]);
  if ((k === 'chickBrand' || k === 'breed') && known) return {val: f.shedInfo[sh][k], locked: true};
  return {val: state.form[k], locked: false};
}
/* sheds are ordered by the number in their name (Shed 4, Shed 5, Shed 6), not by the order they were typed */
const shedNum = n => { const m = String(n || '').match(/(\d+)/); return m ? Number(m[1]) : Infinity; };
const shedCmp = (a, b) => { const d = shedNum(a) - shedNum(b); return (d && !isNaN(d)) ? d : String(a || '').localeCompare(String(b || '')); };
function normaliseVisits(f){
  f.sheds = f.sheds || [];
  f.visits.forEach(v => { v.shed = shedOf(v); if (!f.sheds.includes(v.shed)) f.sheds.push(v.shed); });
  f.sheds.sort(shedCmp);
  f.visits.sort((a,b) => (f.sheds.indexOf(a.shed) - f.sheds.indexOf(b.shed)) || (a.date||'').localeCompare(b.date||''));
}
const fmtDMY = iso => iso ? iso.slice(8,10) + '-' + iso.slice(5,7) + '-' + iso.slice(0,4) : '';
const parseDMY = s => {
  const m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(String(s).trim()); if (!m) return '';
  const d = +m[1], mo = +m[2], y = +m[3];
  const dt = new Date(Date.UTC(y, mo - 1, d));
  if (dt.getUTCDate() !== d || dt.getUTCMonth() !== mo - 1) return '';
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
};

/* ---------- Storage: private db when available, otherwise this browser ---------- */
async function initBackends(){
  if (API_URL && !API_URL.startsWith('PASTE')){ store = {kind:'remote'}; dl = null; return; }
  const tryUse = async name => { try{ return await withTimeout(window.claude.use(name), 5000); }catch(e){ return null; } };
  try{
    const user = await tryUse('user');
    uid = user ? await withTimeout(user.id(), 5000) : null;
    const db = await tryUse('db');
    if (db && uid) store = {kind:'db', db};
  }catch(e){}
  dl = await tryUse('downloads');
}
async function loadFarms(){
  let farms;
  if (store.kind === 'remote'){
    farms = await remoteList();
  } else if (store.kind === 'db'){
    const snap = await withTimeout(store.db.collection('data/users/' + uid).get());
    farms = (snap.docs || []).filter(d => d.exists && !String(d.id).startsWith('rx_')).map(d => ({...d.data(), id: d.id}));
  } else {
    farms = JSON.parse(localStorage.getItem('farmVisits') || '[]');
  }
  return farms.map(f => { const c = JSON.parse(JSON.stringify({type:'layer', ...f})); c.visits = c.visits || []; normaliseVisits(c); c.batches = c.batches || []; c.batches.forEach(b => { b.visits = b.visits || []; b.status = b.status || 'Incomplete'; }); return c; });  // editable copy
}
const withTimeout = (p, ms=10000) => Promise.race([p, new Promise((_,rej) => setTimeout(() => rej(new Error('timed out')), ms))]);
function writeLocal(f){
  const all = JSON.parse(localStorage.getItem('farmVisits') || '[]');
  const i = all.findIndex(x => x.id === f.id);
  if (i >= 0) all[i] = f; else all.push(f);
  localStorage.setItem('farmVisits', JSON.stringify(all));
}
function saveFarm(f){
  writeLocal(f);                                   // always saved on this device right away
  if (store.kind === 'remote'){
    remoteCall({action:'save', farm: f})
      .then(() => { state.syncMsg = 'Google Sheet: saved at ' + new Date().toLocaleTimeString(); state.syncOk = true; render(); })
      .catch(err => { state.syncMsg = 'Google Sheet: NOT saved. Reason: ' + err.message; state.syncOk = false; render(); });
  }
  if (store.kind === 'db'){
    withTimeout(store.db.collection('data/users/' + uid).doc(f.id).set(f))
      .catch(err => toast('Cloud save failed: ' + (err && err.message || err)));
  }
  return Promise.resolve();
}

/* ---------- UI helpers ---------- */
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
/* ---------- Photos ---------- */
function photoInputHTML(kind){
  return `<div class="card" style="margin-top:12px"><b>Photos</b> <span class="muted">Prescription, post-mortem, etc. Files upload when you press Save Visit.</span>
    <div class="row" style="margin-top:8px"><input type="file" accept="image/*" multiple data-photo="${kind}"></div>
    <div class="muted">${state.photos.length} photo(s) ready to upload.</div></div>`;
}
function compressImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res({name: file.name, data: c.toDataURL('image/jpeg', 0.8)});
      URL.revokeObjectURL(url);
    };

function brCalc(batch, v, cumBefore){
  const flock = num(batch.flock), mort = num(v.mortality) || 0;
  const live = flock != null ? flock - cumBefore - mort : null;
  const bw = (live != null && num(v.avgW) != null) ? live * num(v.avgW) / 1000 : null;   // kg
  const kg = num(v.totalKg), bag = num(v.totalBag);
  const fcr = (kg != null && bw) ? kg / bw : null;
  const fcrBag = fcr ? 50 / fcr : null;   // FCR per bag = 50 kg ÷ FCR
  return {live, bw, fcr, fcrBag};
}

function shedOrder(batches){

async function brDownload(farms, name){
  const list = farms.filter(Boolean);
  const headers = ['Date','Farmer Name','Address','Mobile No','DOC Brand','Feed Brand','Flock Size (Pcs)','Mortality','Live Birds','Age (Days)',
    'Total Feed Intake (bag)','Total Feed Intake (kg)','Avg. Body Weight (g)','Total Body Weight (kg)','FCR','FCR (bag)','1st Vaccine : ND+IB (Day)','2nd Vaccine: IBD (Day)','3rd Vaccine: IBD (Day)','4th Vaccine: ND+IB (Day)','Suggested Medicine','Problem','Dealer Name'];
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Boiler A');
  ws.columns = headers.map(h => ({header: h, width: Math.max(13, Math.min(h.length + 3, 28))}));
  const border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
  const hr = ws.getRow(1); hr.height = 34;
  hr.eachCell(c => { c.font = {bold:true}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFBE3CF'}};
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; c.border = border; });
  const r0 = v => (v == null || !isFinite(v)) ? '' : +v.toFixed(2);
  let first = true;
  for (const f of list){
    for (const batch of (f.batches || [])){
      if (!first) ws.addRow([]);            // blank row between batches
      first = false;
      // batch banner: Batch 1, Batch 2, ... each batch kept together
      const banner = ws.addRow([`${batch.name || 'Batch'}  ·  ${f.name || ''}  ·  Status: ${batch.status || 'Incomplete'}  ·  DOC: ${batch.docBrand || ''}  ·  Feed: ${batch.feedBrand || ''}  ·  Flock: ${batch.flock || ''}`]);
      ws.mergeCells(banner.number, 1, banner.number, headers.length);
      banner.font = {bold:true};
      banner.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFDDEBF7'}};
      banner.alignment = {horizontal:'left', vertical:'middle'};
      let cum = 0;
      for (const v of batch.visits){
        const c = brCalc(batch, v, cum); cum += num(v.mortality) || 0;
        ws.addRow([fmtDMY(v.date), f.name, f.address, f.mobile, batch.docBrand, batch.feedBrand, num(batch.flock),
          num(v.mortality), c.live ?? '', num(v.age), num(v.totalBag), num(v.totalKg), num(v.avgW),
          r0(c.bw), r0(c.fcr), c.fcrBag == null ? '' : +c.fcrBag.toFixed(2), v.bv1, v.bv2, v.bv3, v.bv4, v.suggestedMedicine, v.problem, v.dealer]);
      }
    }
  }
  // every data row is a full table row, empty cells included; blank separator rows stay blank
  for (let r = 2; r <= ws.rowCount; r++){
    const vals = ws.getRow(r).values;
    if (!vals || vals.length <= 1) continue;
    for (let c = 1; c <= headers.length; c++){
      const cell = ws.getCell(r, c);
      cell.border = border;
      cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  const u8 = new Uint8Array(buf);
  if (dl){
    try{ await dl.save({filename: name, data: u8}); }catch(e){ toast('Download cancelled or failed'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([u8], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

        <button class="danger" data-act="mdDelete" data-f="${esc(f.id)}" data-i="${x.i}">✕ Delete</button></td></tr>`;
    }).join('');
    return `<div class="tablewrap" style="margin-bottom:18px"><table style="min-width:2200px"><thead><tr>${MODEL_INFO_H.concat(MODEL_VISIT_H).map(h => `<th>${esc(h)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join('');
  const bt = brUnits(groups).map((g, i) => ({...g, i, t: brTrack(g.f, g.b)}));
  const brTop = modelTable(BR_TRACK_H, bt.map(x => [x.i + 1, x.f.name, x.f.address, x.f.mobile, x.t.docCompany, x.t.docSpecies, x.t.feedBrand, x.t.startDate]),
    'Broiler Farm Tracking List', r => trackButtons('broiler', bt[r[0] - 1].f, bt[r[0] - 1].b));
  const btAll = groups.map((g, i) => ({...g, i, t: brTrack(g.f, g.b)}));
  const brBlocks = btAll.map(g => {
    const cum = brCumBefore(g.b), n = g.items.length;
    const farmVals = [g.f.name, g.f.address, g.f.mobile, g.t.docCompany, g.t.docSpecies, g.f.feedBrand, g.t.startDate];
    const rows = g.items.map((x, k) => {
      const cells = brModelCells(g.b, x.v, cum[x.i]).map(val => `<td style="text-align:center">${esc(val ?? '')}</td>`).join('');
      const farm = k === 0 ? farmVals.map(val => `<td rowspan="${n}" style="text-align:center;font-weight:600">${esc(val ?? '')}</td>`).join('') : '';
      return `<tr>${farm}${cells}<td><button data-act="mdEdit" data-f="${esc(g.f.id)}" data-b="${esc(g.b.id)}" data-i="${x.i}">Edit</button>
        <button class="danger" data-act="mdDelete" data-f="${esc(g.f.id)}" data-b="${esc(g.b.id)}" data-i="${x.i}">✕ Delete</button></td></tr>`;
    }).join('');
    return `<div class="row" style="justify-content:space-between;margin:14px 0 6px"><b>${esc(g.f.name)} · ${esc(g.b.name)}</b><span class="muted">Start date: ${esc(g.t.startDate || '-')}</span><label class="muted"><input type="checkbox" data-brmodel="${esc(g.b.id)}" data-brf="${esc(g.f.id)}" checked style="min-width:0"> Show in Model Farm</label></div><div class="tablewrap" style="margin-bottom:18px"><table style="min-width:2400px"><thead><tr>${BR_INFO_H.concat(BR_VISIT_H).map(h => `<th>${esc(h)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join('');
  const cb = cbSection();
  if (!layer.length && !groups.length && !cb.groups.length) return `<h2>Model Farm</h2><p class="muted">No model farm yet. In a visit, choose "Model Farm? (Yes/No)" = Yes to add it here.</p>`;
  const feeds = [...new Set(state.farms.flatMap(f => f.type === 'layer' ? [f.feedBrand] : (f.batches || []).map(b => b.feedBrand)).map(x => String(x || '').trim()).filter(Boolean))]
    .sort((a,b) => (feedRank(a) - feedRank(b)) || a.localeCompare(b));
  const sel = (key, opts) => `<select data-mf="${key}">${opts.map(([v,l]) => `<option value="${v}" ${String(state.mf[key]) === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const mfBar = `<div class="card"><div class="row">
    <label>Farm type${sel('type', [['all','Layer and Broiler'],['layer','Layer'],['broiler','Broiler']])}</label>
    <label>Feed${sel('feed', [['all','All feeds']].concat(feeds.map(x => [x, x])))}</label>
    <label>Farm${sel('farm', [['all','All farms']].concat(state.farms.filter(f => ['layer','broiler'].includes(f.type)).map(f => [f.id, f.name])))}</label>
    <label>Period${sel('period', [['all','All time'],['thismonth','This month'],['lastmonth','Last month'],['last2','Last 2 months'],['custom','From - To']])}</label>
    ${state.mf.period === 'custom' ? `<label>From<input type="date" data-mf="from" value="${esc(state.mf.from)}"></label><label>To<input type="date" data-mf="to" value="${esc(state.mf.to)}"></label>` : ''}
    <label>Excel feed order (comma separated)<input data-mf="order" value="${esc(state.mf.order)}" placeholder="Haid, CP, Narish, Paragon"></label>
    <button data-act="mfView">${state.mfView ? 'Back to edit view' : 'View Excel sheet'}</button>
  </div></div>`;
  if (state.mfView) return `<h2>Model Farm</h2>
    ${mfBar}
    ${excelPreviewHTML()}`;
  return `<h2>Model Farm</h2>
    ${mfBar}
    <div class="row"><button class="primary" data-act="mdDownload">Download Layer Model Farm (Excel)</button>
      ${brPickHTML()}
      <button class="primary" data-act="mdBrDownload">Download Broiler Model Farm (Excel)</button>
      <button class="primary" data-act="mdCbDownload">Download Color Bird Model Farm (Excel)</button></div>
    ${trackEditHTML()}
    ${state.mf.type !== 'broiler' ? `${layerTop}
    <h3 style="margin-top:22px">Layer Model Farm</h3>
    ${layerBlocks}` : ''}
    ${state.mf.type !== 'layer' ? `${brTop}
    <h3 style="margin-top:22px">Broiler Model Farm</h3>
    ${brBlocks}` : ''}
    ${cb.groups.length && state.mf.type !== 'layer' ? `${cb.top}
    <h3 style="margin-top:22px">Color Bird Model Farm</h3>
    ${cb.blocks}` : ''}`;
}

/* ---------- Excel: Layer = tracking list on sheet 1, then one sheet per model farm ---------- */
function sheetName(wb, base){
  let name = (base || 'Farm').replace(/[\\\/?*\[\]:]/g, '').slice(0, 28) || 'Farm', k = 2, out = name;
  while (wb.getWorksheet(out)) out = name.slice(0, 26) + ' ' + k++;
  return out;
}
function xlStyle(border){ return {border, alignment:{horizontal:'center', vertical:'middle', wrapText:true}}; }
async function saveXlsx(wb, name){
  const buf = await wb.xlsx.writeBuffer();
  const u8 = new Uint8Array(buf);
  if (dl){
    try{ await dl.save({filename: name, data: u8}); }catch(e){ toast('Download cancelled or failed'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([u8], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
const xlRow = (ws, values, n, border) => {
  const r = ws.addRow(values);
  for (let c = 1; c <= n; c++){ const cell = ws.getCell(r.number, c); cell.border = border; cell.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; }
  return r;
};
const xlHead = (ws, headers, border) => {
  const r = ws.addRow(headers); r.height = 34;
  r.eachCell(c => { c.font = {bold:true}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFBE3CF'}}; c.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; c.border = border; });
};
async function modelDownload(){
  if (state.mf.type === 'broiler') return toast('Select Layer or All in the filter');
  const list = modelFarms();
  if (!list.length) return toast('No layer model farm to download');
  const wb = new ExcelJS.Workbook();
  const border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
  const tl = list.map((f, i) => ({f, i, t: layerTrack(f)}));
  const ws1 = wb.addWorksheet('Layer Tracking List');
  const t1 = ws1.addRow(['Layer Farm Tracking List']); t1.font = {bold:true, size:13};
  ws1.mergeCells(t1.number, 1, t1.number, MODEL_TOP_H.length);
  xlHead(ws1, MODEL_TOP_H, border);
  tl.forEach(x => xlRow(ws1, [x.i + 1, x.f.name, x.f.address, x.f.mobile, x.t.docQty, x.t.feedBrand, x.t.dealer, x.t.docDate, x.t.docCompany, x.t.cash], MODEL_TOP_H.length, border));
  for (let c = 1; c <= MODEL_TOP_H.length; c++) ws1.getColumn(c).width = 20;
  const N = MODEL_INFO_H.length + MODEL_VISIT_H.length;
  list.forEach(f => {
    const ws = wb.addWorksheet(sheetName(wb, f.name));
    const mv = modelRows(f), info = shedInfoOf(f, shedOf(mv[0].v));
    const farmVals = [f.name, f.address, f.mobile, info.chickBrand, info.breed, f.feedBrand];
    xlHead(ws, MODEL_INFO_H.concat(MODEL_VISIT_H), border);
    const start = ws.rowCount + 1;
    mv.forEach((x, k) => xlRow(ws, (k === 0 ? farmVals : new Array(6).fill('')).concat(modelVisitCells(x.v)), N, border));
    const end = ws.rowCount;
    for (let col = 1; col <= 6; col++){
      if (end > start) ws.mergeCells(start, col, end, col);
      ws.getCell(start, col).font = {bold:true};
    }
    for (let c = 1; c <= N; c++) ws.getColumn(c).width = 18;
  });
  await saveXlsx(wb, 'layer_model_farm.xlsx');
}
function cbSection(){
  const groups = brModelGroups('colorbird');
  if (!groups.length || state.mf.type === 'layer') return {groups, top:'', blocks:''};
  const bt = brUnits(groups).map((g, i) => ({...g, i, t: brTrack(g.f, g.b)}));
  const cbTop = modelTable(BR_TRACK_H, bt.map(x => [x.i + 1, x.f.name, x.f.address, x.f.mobile, x.t.docCompany, x.t.docSpecies, x.t.feedBrand, x.t.startDate]),
    'Color Bird Farm Tracking List', r => trackButtons('broiler', bt[r[0] - 1].f, bt[r[0] - 1].b));
  const btAll = groups.map((g, i) => ({...g, i, t: brTrack(g.f, g.b)}));
  const cbBlocks = btAll.map(g => {
    const cum = brCumBefore(g.b), n = g.items.length;
    const farmVals = [g.f.name, g.f.address, g.f.mobile, g.t.docCompany, g.t.docSpecies, g.f.feedBrand, g.t.startDate];
    const rows = g.items.map((x, k) => {
      const cells = brModelCells(g.b, x.v, cum[x.i]).map(val => `<td style="text-align:center">${esc(val ?? '')}</td>`).join('');
      const farm = k === 0 ? farmVals.map(val => `<td rowspan="${n}" style="text-align:center;font-weight:600">${esc(val ?? '')}</td>`).join('') : '';
      return `<tr>${farm}${cells}<td><button data-act="mdEdit" data-f="${esc(g.f.id)}" data-b="${esc(g.b.id)}" data-i="${x.i}">Edit</button>
        <button class="danger" data-act="mdDelete" data-f="${esc(g.f.id)}" data-b="${esc(g.b.id)}" data-i="${x.i}">✕ Delete</button></td></tr>`;
    }).join('');
    return `<div class="row" style="justify-content:space-between;margin:14px 0 6px"><b>${esc(g.f.name)} · ${esc(g.b.name)}</b><span class="muted">Start date: ${esc(g.t.startDate || '-')}</span><label class="muted"><input type="checkbox" data-brmodel="${esc(g.b.id)}" data-brf="${esc(g.f.id)}" checked style="min-width:0"> Show in Model Farm</label></div><div class="tablewrap" style="margin-bottom:18px"><table style="min-width:2400px"><thead><tr>${BR_INFO_H.concat(BR_VISIT_H).map(h => `<th>${esc(h)}</th>`).join('')}<th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join('');
  return {groups, top: cbTop, blocks: cbBlocks};
}
function brPickHTML(){
  const groups = [...brModelGroups('broiler'), ...brModelGroups('colorbird')];
  if (!groups.length) return '';
  return `<div class="card" style="width:100%"><b>Batches to include in the download</b>
    <div class="row">${groups.map(g => `<label class="inline"><input type="checkbox" data-mdpick="${esc(g.b.id)}" ${state.mdPick[g.b.id] === false ? '' : 'checked'} style="min-width:0"> ${esc(g.f.name)} · ${esc(g.b.name)}</label>`).join('')}</div></div>`;
}
async function brModelDownload(type = 'broiler'){
  if (state.mf.type === 'layer') return toast('Select Broiler or All in the filter');
  const groups = brModelGroups(type).filter(g => state.mdPick[g.b.id] !== false);
  if (!groups.length) return toast('No model farm to download');
  const wb = new ExcelJS.Workbook();
  const border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
  const bt = brUnits(groups).map((g, i) => ({...g, i, t: brTrack(g.f, g.b)}));
  const ws1 = wb.addWorksheet(type === 'colorbird' ? 'Color Bird Tracking List' : 'Broiler Tracking List');
  const t1 = ws1.addRow(['Broiler Farm Tracking List']); t1.font = {bold:true, size:13};
  ws1.mergeCells(t1.number, 1, t1.number, BR_TRACK_H.length);
  xlHead(ws1, BR_TRACK_H, border);
  bt.forEach(x => xlRow(ws1, [x.i + 1, x.f.name, x.f.address, x.f.mobile, x.t.docCompany, x.t.docSpecies, x.t.feedBrand, x.t.startDate], BR_TRACK_H.length, border));
  for (let c = 1; c <= BR_TRACK_H.length; c++) ws1.getColumn(c).width = 20;
  const N = BR_INFO_H.length + BR_VISIT_H.length, FARM_COLS = BR_INFO_H.length;
  const byFarm = new Map();
  groups.forEach(g => { if (!byFarm.has(g.f.name)) byFarm.set(g.f.name, {f: g.f, list: []}); byFarm.get(g.f.name).list.push(g); });
  byFarm.forEach(({f, list}) => {
    const ws = wb.addWorksheet(sheetName(wb, f.name));
    list.forEach((g, k) => {
      if (k > 0) ws.addRow([]);
      const cum = brCumBefore(g.b), t = brTrack(f, g.b);
      const farmVals = [f.name, f.address, f.mobile, t.docCompany, t.docSpecies, f.feedBrand, t.startDate];
      xlHead(ws, BR_INFO_H.concat(BR_VISIT_H), border);
      const start = ws.rowCount + 1;
      g.items.forEach((x, i) => xlRow(ws, (i === 0 ? farmVals : new Array(FARM_COLS).fill('')).concat(brModelCells(g.b, x.v, cum[x.i])), N, border));
      const end = ws.rowCount;
      for (let col = 1; col <= FARM_COLS; col++){
        if (end > start) ws.mergeCells(start, col, end, col);
        ws.getCell(start, col).font = {bold:true};
      }
    });
    for (let c = 1; c <= N; c++) ws.getColumn(c).width = 18;
  });
  await saveXlsx(wb, type === 'colorbird' ? 'color_bird_model_farm.xlsx' : 'broiler_model_farm.xlsx');
}

function rxFromItem(it){
  return {farmId: it.farmId || '', owner: it.owner || '', address: it.address || '', mobile: it.mobile || '', species: it.species || '',
    flock: it.flock || '', age: it.age || '', date: it.date || '', iso: it.iso || today(), history: it.history || '',
    diagnosis: it.diagnosis || '', advice: it.advice || '', meds: clone(it.meds || []), saveId: it.id};
}
function rxSig(m){
  let out;
  if (m.vacc){
    const route = RX_ROUTE_ALL[m.route] || '';
    if (RX_DROP.includes(m.route)) out = `১ ফোঁটা ${route}`;
    else if (RX_INJ.includes(m.route)) out = `${!rxBlank(m.vdose) ? rxBn(m.vdose) + ' মিলি ' : ''}${route}`.trim();
    else out = `${!rxBlank(m.hours) ? rxBn(m.hours) + ' ঘন্টার ' : ''}${route}`.trim();
  } else {
    const route = RX_ROUTE[m.route] || '';
    out = !rxBlank(m.dose) ? `${rxBn(m.dose)} ${RX_UNIT[m.unit] || ''}` : '';
    if (!rxBlank(m.per)) out += ` ${rxBn(m.per)} ${RX_PER[m.perUnit] || RX_UNIT[m.perUnit] || ''}`;
    out = `${out.trim()} ${route}`.trim();
    if (!rxBlank(m.hours)) out += ` - ${rxBn(m.hours)} ঘন্টা`;
  }
  if ((m.slots || []).length) out += ` (${m.slots.join(' + ')})`;
  if (!rxBlank(m.days)) out += `, ${rxBn(m.days)} দিন`;
  return out.trim();
}
function rxPickFarm(id){
  const f = state.farms.find(x => x.id === id), r = state.rx;
  r.farmId = f ? f.id : '';
  if (!f){ Object.assign(r, {owner:'', address:'', mobile:'', species:'', flock:'', age:''}); return; }
  const batch = f.type === 'layer' ? null : (f.batches || []).filter(b => (b.visits || []).length).slice(-1)[0];
  const last = f.type === 'layer' ? (f.visits || []).slice(-1)[0] : batch && batch.visits.slice(-1)[0];
  r.owner = f.name || ''; r.address = f.address || ''; r.mobile = f.mobile || '';
  r.species = f.type === 'layer' ? 'Layer' : f.type === 'broiler' ? 'Broiler' : 'Color Bird / Sonali';
  r.flock = f.type === 'layer' ? (last?.chicks || '') : (batch?.flock || '');
  r.age = !last ? '' : (f.type === 'layer' ? Math.round(num(last.ageWeeks) * 7) || '' : last.age || '');
}

/* records */
async function loadRx(){
  try{
    if (store.kind === 'remote'){ const j = await remoteGet({action:'rxlist'}); return j.items || []; }
    if (store.kind === 'db'){
      const snap = await withTimeout(store.db.collection('data/users/' + uid).get());
      return (snap.docs || []).filter(d => d.exists && String(d.id).startsWith('rx_')).map(d => ({...d.data(), id: d.id}));
    }
  }catch(e){ toast('Prescriptions could not be loaded: ' + e.message); }
  return JSON.parse(localStorage.getItem('rxList') || '[]');
}
async function saveRxItem(item){
  state.rxList = state.rxList.filter(x => x.id !== item.id).concat([item]);
  localStorage.setItem('rxList', JSON.stringify(state.rxList));
  if (store.kind === 'remote') await remoteCall({action:'rxsave', item});
  else if (store.kind === 'db') await withTimeout(store.db.collection('data/users/' + uid).doc(item.id).set(item));
}
async function deleteRxItem(id){
  state.rxList = state.rxList.filter(x => x.id !== id);
  localStorage.setItem('rxList', JSON.stringify(state.rxList));
  if (store.kind === 'remote') await remoteCall({action:'rxdel', id});
  else if (store.kind === 'db') await withTimeout(store.db.collection('data/users/' + uid).doc(id).delete());
}
/* the prescription page is also kept as an image in Google Drive */
async function rxUploadImage(id){
  const el = document.getElementById('rxPad');
  if (!el || !window.html2canvas) return;
  const canvas = await html2canvas(el, {scale: 2, backgroundColor: '#ffffff'});
  const name = `prescription_${(state.rx.owner || 'owner').replace(/\W+/g, '_')}_${state.rx.date.replace(/-/g, '')}_${id}.png`;
  await remoteCall({action:'rxfile', id, name, data: canvas.toDataURL('image/png')});
}
async function rxSave(){
  const r = state.rx;
  if (rxBlank(r.owner) && rxBlank(r.diagnosis) && r.meds.every(m => rxBlank(m.name))) return toast('Enter at least the owner name or a medicine');
  const id = r.saveId || 'rx_' + Date.now();
  const item = {id, farmId: r.farmId, owner: r.owner, address: r.address, mobile: r.mobile, species: r.species, flock: r.flock,
    age: r.age, date: r.date, iso: r.iso, history: r.history, diagnosis: r.diagnosis, advice: r.advice, meds: clone(r.meds)};
  try{ await saveRxItem(item); state.rx.saveId = id; toast('Prescription saved'); if (store.kind === 'remote') rxUploadImage(id).catch(err => toast('Image not saved to Drive: ' + err.message)); }
  catch(err){ toast('Not saved: ' + (err.message || err)); }
  render();
}
function rxWeekRange(){ const s = mondayOf(today()); return [s, addDays(s, 6)]; }

  const [ws, we] = rxWeekRange(), m = thisMonth();

  const cnt = fn => all.filter(fn).length;
  const byOwner = {};
  all.forEach(x => { const k = x.owner || '(no name)'; byOwner[k] = byOwner[k] || {n:0, last:''}; byOwner[k].n++; if ((x.iso || '') > byOwner[k].last) byOwner[k].last = x.iso || ''; });
  const owners = Object.entries(byOwner).sort((a,b) => b[1].n - a[1].n);
  return `<div class="grid">
      <div class="card stat"><b>${cnt(x => x.iso >= ws && x.iso <= we)}</b><span>Prescriptions this week</span></div>
      <div class="card stat"><b>${cnt(x => (x.iso || '').slice(0,7) === m)}</b><span>Prescriptions this month</span></div>

}

async function rxExport(kind){
  const el = document.getElementById('rxPad');
  if (!el || !window.html2canvas) return toast('Export library is not loaded');
  const canvas = await html2canvas(el, {scale: 2, backgroundColor: '#ffffff'});
  const base = `prescription_${(state.rx.owner || 'owner').replace(/\W+/g, '_')}_${state.rx.date.replace(/-/g, '')}`;
  let bytes, name, mime;
  if (kind === 'pdf'){
    const pdf = new window.jspdf.jsPDF({orientation: canvas.width > canvas.height ? 'l' : 'p', unit: 'px', format: [canvas.width, canvas.height]});
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
    bytes = new Uint8Array(pdf.output('arraybuffer')); name = base + '.pdf'; mime = 'application/pdf';
  } else {
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    bytes = new Uint8Array(await blob.arrayBuffer()); name = base + '.png'; mime = 'image/png';
  }
  if (dl){ try{ await dl.save({filename: name, data: bytes}); }catch(e){ toast('Download cancelled or failed'); } return; }
  const url = URL.createObjectURL(new Blob([bytes], {type: mime}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function rxSend(){
  const r = state.rx;

}

const DL_POLICY = ['Cash + Credit','Cash','Credit'];
const blank_dl = x => x == null || String(x).trim() === '';
function dealers(){ return state.farms.filter(f => f.type === 'dealer'); }
function dealerByName(n){ const k = String(n || '').trim().toLowerCase(); return dealers().find(d => String(d.name || '').trim().toLowerCase() === k); }
function dealerDataList(){ return `<datalist id="dealerList">${dealers().map(d => `<option value="${esc(d.name)}">`).join('')}</datalist>`; }
function reportTextFor(date){
  const visits = [];
  state.farms.filter(f => ['layer','broiler','colorbird'].includes(f.type)).forEach(f => {
    if (f.type === 'layer') (f.visits || []).forEach(v => { if (v.date === date) visits.push({f, v, t: 'layer'}); });
    else (f.batches || []).forEach(b => (b.visits || []).forEach(v => { if (v.date === date) visits.push({f, v, b, t: f.type}); }));
  });
  const L = [];
  const names = [...new Set(visits.map(x => String(x.v.dealer || '').trim()).filter(Boolean))];
  if (names.length){
    L.push('DEALER VISITS', '');
    names.forEach((n, i) => {
      const d = dealerByName(n) || {};
      const cap = dealerTotal(d);
      L.push(`${i + 1}. ${d.shop || n}`,
        ...(d.shop ? [`Dealer: ${n}`] : []),
        `Address: ${d.address || '-'}`,
        `Mobile: ${d.mobile || '-'}`,
        `Feed: ${feedNames(d) || '-'}`,
        `Layer: ${d.capLayer ? d.capLayer + ' tons' : '-'}`,
        `Broiler: ${d.capBroiler ? d.capBroiler + ' tons' : '-'}`,
        `Color Bird / Sonali: ${d.capColor ? d.capColor + ' tons' : '-'}`,
        `Monthly Sales Capacity: ${cap ? cap + ' tons' : '-'}`,
        `Policy: ${d.policy || '-'}`);
      L.push('');
    });
  }
  if (visits.length){
    L.push('FARM VISITS', '');
    visits.forEach((x, i) => {
      const isLayer = x.t === 'layer';
      const info = isLayer ? shedInfoOf(x.f, shedOf(x.v)) : {chickBrand: x.b.docBrand};
      const feed = isLayer ? x.f.feedBrand : (x.b.feedBrand || x.f.feedBrand);
      const age = isLayer ? (x.v.ageWeeks ? x.v.ageWeeks + ' weeks' : '-') : (x.v.age ? x.v.age + ' days' : '-');
      L.push(`${i + 1}. ${x.f.name || '-'}`,
        `Mobile: ${x.f.mobile || '-'}`,
        `Address: ${x.f.address || '-'}`,
        `DOC Brand: ${info.chickBrand || '-'}`,
        `Feed Brand: ${feed || '-'}`,
        `Type: ${isLayer ? 'Layer' : (x.t === 'broiler' ? 'Broiler' : 'Color Bird / Sonali')}`,
        `Age: ${age}`);
      if (isLayer){
        const c = calc(x.v);
        L.push(`Feed Intake/day: ${x.v.dailyFeed ? x.v.dailyFeed + ' kg' : '-'}`,
          `Production: ${c.rate == null ? '-' : Math.round(c.rate * 100) / 100 + '%'}`);
      } else {
        const tons = num(x.b.flock) != null ? Math.round(num(x.b.flock) / 1000 * 2.5 * 100) / 100 : null;
        L.push(`Monthly Consumption: ${tons == null ? '-' : tons + ' tons'}`);
      }
      L.push(`Dealer: ${x.v.dealer || '-'}`, '');
    });
  }
  return L.join('\n').trim();
}

function dealerTotal(d){ return (num(d.capLayer) || 0) + (num(d.capBroiler) || 0) + (num(d.capColor) || 0); }

const FARMER_H = ['Number','Farmer name','Address','Mobile No','Type','Capacity (birds)','Dealer name'];
const DEALER_H = ['Number','Shop name','Dealer name','Address','Mobile No','Feeds (tons per month)','Layer capacity (tons/month)','Broiler capacity (tons/month)',
  'Color Bird / Sonali capacity (tons/month)','Monthly total sales capacity (tons)','Policy'];
function dealerRowsOut(){

    d.capLayer || '', d.capBroiler || '', d.capColor || '', dealerTotal(d) || '', d.policy || '']; });

/* ---------- Customer List (dealers and farmers) ---------- */
const FR_TYPES = ['Layer','Broiler','Color Bird / Sonali'];
const frKey = f => String(f.mobile || f.name || f.id || '').replace(/\s+/g, '');
function farmerGroups(){
  const map = {}, order = [], hidden = {};
  state.farms.filter(f => f.type === 'farmer' && f.hidden).forEach(f => { hidden[frKey(f)] = true; });
  const get = k => { if (!map[k]){ map[k] = {key:k, name:'', address:'', mobile:'', types:[], cap:null, farmCap:0, dealer:'', vdealer:'', last:''}; order.push(k); } return map[k]; };
  state.farms.filter(f => f.type === 'farmer' && !f.hidden).forEach(f => {
    const g = get(frKey(f));
    g.name = f.name || g.name; g.address = f.address || g.address; g.mobile = f.mobile || g.mobile;
    (f.types || []).forEach(t => { if (!g.types.includes(t)) g.types.push(t); });
    if (!blank_dl(f.cap)) g.cap = num(f.cap);
    if (!blank_dl(f.dealer)) g.dealer = String(f.dealer).trim();
  });
  state.farms.filter(f => ['layer','broiler','colorbird'].includes(f.type)).forEach(f => {
    const k = frKey(f); if (hidden[k]) return;
    const g = get(k);
    if (!g.name) g.name = f.name || ''; if (!g.address) g.address = f.address || ''; if (!g.mobile) g.mobile = f.mobile || '';
    const lbl = f.type === 'layer' ? 'Layer' : f.type === 'broiler' ? 'Broiler' : 'Color Bird / Sonali';
    if (!g.types.includes(lbl)) g.types.push(lbl);
    if (f.type === 'layer'){
      const vs = (f.visits || []).slice().sort((a,b) => (a.date || '').localeCompare(b.date || ''));
      if (vs.length) g.farmCap += num(vs[vs.length - 1].chicks) || 0;
    } else {
      const bs = (f.batches || []).filter(b => (b.visits || []).length);
      if (bs.length) g.farmCap += num(bs[bs.length - 1].flock) || 0;
    }
    (f.type === 'layer' ? (f.visits || []) : (f.batches || []).flatMap(b => b.visits || [])).forEach(v => {
      if (!blank_dl(v.dealer) && (v.date || '') >= g.last){ g.last = v.date || ''; g.vdealer = String(v.dealer).trim(); }
    });
  });
  return order.filter(k => !hidden[k]).map(k => { const g = map[k]; return {...g, cap: g.cap != null ? g.cap : g.farmCap, dealer: g.dealer || g.vdealer}; });
}

/* ---------- Recycle Bin (kept 48 hours) ---------- */
const TRASH_MS = 48 * 3600 * 1000;
function purgeRecord(id){
  if (store.kind === 'remote') remoteCall({action:'delete', id}).catch(() => {});
  if (store.kind === 'db') withTimeout(store.db.collection('data/users/' + uid).doc(id).delete()).catch(() => {});
}
function addTrash(kind, name, payload){
  const rec = {id: 'trash_' + Date.now() + '_' + Math.floor(Math.random() * 1e6), type: 'trash', kind, name: name || '', deletedAt: Date.now(), payload};
  state.trash = (state.trash || []).concat([rec]);
  saveFarm(clone(rec));
}
async function moveRxToTrash(id){
  const it = state.rxList.find(x => x.id === id); if (!it) return;
  addTrash('rx', (it.owner || 'Prescription') + ' - ' + (it.date || ''), clone(it));
  await deleteRxItem(id);
}
function splitTrash(){
  const cutoff = Date.now() - TRASH_MS;
  const all = state.farms || [];
  const isTrash = f => f.type === 'trash' || !!f.deletedAt;
  all.filter(f => isTrash(f) && (f.deletedAt || 0) < cutoff).forEach(f => purgeRecord(f.id));
  state.trash = all.filter(f => isTrash(f) && (f.deletedAt || 0) >= cutoff);
  state.farms = all.filter(f => !isTrash(f));
}
function trashHTML(){
  const items = (state.trash || []).slice().sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
  const sel = state.trSel || {};
  const label = x => x.type === 'trash' ? ({visit:'Farm visit', farmer:'Farmer', rx:'E-prescription'})[x.kind] || 'Item' : ({layer:'Layer farm', broiler:'Broiler farm', colorbird:'Color Bird / Sonali farm', dealer:'Dealer'})[x.type] || x.type;
  if (!items.length) return `<h2>Recycle Bin</h2><p class="muted">Nothing here. Deleted items stay here for 48 hours, then they are removed for good.</p>`;
  const picked = Object.keys(sel).length;
  const allOn = items.every(x => sel[x.id]);
  const rows = items.map(x => {
    const left = Math.max(0, (TRASH_MS - (Date.now() - x.deletedAt)) / 3600000).toFixed(1);
    return `<tr><td><input type="checkbox" data-trsel="${esc(x.id)}" ${sel[x.id] ? 'checked' : ''} style="min-width:0"></td>
      <td>${esc(label(x))}</td><td>${esc(x.name || x.shop || '-')}</td><td>${esc(new Date(x.deletedAt).toLocaleString())}</td><td>${left} hours</td>
      <td><button class="primary" data-act="trRestore" data-id="${esc(x.id)}">Restore</button> <button class="danger" data-act="trPurge" data-id="${esc(x.id)}">Delete now</button></td></tr>`;
  }).join('');
  return `<h2>Recycle Bin</h2>
    <p class="muted">Items stay for 48 hours. Tick the items you want, or tick "Select all". Restore brings them back to their list.</p>
    <div class="row">
      <label class="inline"><input type="checkbox" data-trall ${allOn ? 'checked' : ''} style="min-width:0"> Select all</label>
      <button class="primary" data-act="trSelRestore" ${picked ? '' : 'disabled'}>Restore selected (${picked})</button>
      <button class="danger" data-act="trSelPurge" ${picked ? '' : 'disabled'}>Delete selected for good (${picked})</button>

}

/* View Sheet download: the same detailed layout as the screen, farmer blocks and shed/batch blocks merged */
function vsSpanInfo2(rows, spans){
  const n = rows.length, skip = rows.map(() => ({})), blocks = [];
  spans.forEach(sp => {
    const ranges = [];
    if (sp.key == null) ranges.push([0, n - 1]);
    else { let a = 0; for (let i = 1; i <= n; i++){ if (i === n || vsKey(rows[i], sp.key) !== vsKey(rows[a], sp.key)){ ranges.push([a, i - 1]); a = i; } } }
    ranges.forEach(([a, b]) => sp.cols.forEach(c => { blocks.push({a, b, c}); for (let i = a + 1; i <= b; i++) skip[i][c] = true; }));
  });
  return {skip, blocks};
}
async function vsDownload(){
  const data = vsBuild();
  if (!data.layer.length && !data.broiler.length && !data.colorbird.length) return toast('No data for this period');
  const wb = new ExcelJS.Workbook();
  const border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
  // one Excel sheet per farm type, laid out exactly like the View Sheet table on screen
  const sheet = (name, headers, groups, spans) => {
    const ws = wb.addWorksheet(name);
    for (let c = 1; c <= headers.length; c++) ws.getColumn(c).width = 18;
    const h = ws.addRow(headers); h.height = 34;
    h.eachCell(c => { c.font = {bold:true}; c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFBE3CF'}};
      c.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; c.border = border; });
    groups.forEach((g, gi) => {
      const start = ws.rowCount + 1, {skip, blocks} = vsSpanInfo2(g.rows, spans);
      g.rows.forEach((r, i) => {
        const row = ws.addRow(r.map((val, c) => skip[i][c] ? '' : val));
        row.eachCell({includeEmpty:true}, c => { c.border = border; c.alignment = {horizontal:'center', vertical:'middle', wrapText:true}; });
      });
      blocks.forEach(({a, b, c}) => { if (b > a) ws.mergeCells(start + a, c + 1, start + b, c + 1); });
      if (gi < groups.length - 1) ws.addRow([]);   // gap between farms, as on screen
    });
  };
  sheet('Layer', LAYER_H, data.layer, VS_LAYER_SPANS);
  sheet('Broiler', BROILER_H, data.broiler, VS_BROILER_SPANS);
  sheet('Color Bird', BROILER_H, data.colorbird, VS_BROILER_SPANS);
  const buf = await wb.xlsx.writeBuffer();
  const u8 = new Uint8Array(buf), name = `view_sheet_${data.label}.xlsx`;
  if (dl){
    try{ await dl.save({filename: name, data: u8}); }catch(e){ toast('Download cancelled or failed'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([u8], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

async function download(list, name){
  if (!list.length) return toast('No data to download');
  const headers = ['Farmer Name','Address','Mobile','Feed Brand','Shed','Chick Brand','Breed','Visit Date','Age (Weeks)','Number of Chicks','Mortality', 'Avg. Body Weight (kg)',
    'Daily Feed Intake (bags)','Daily Feed Intake (kg)','Avg. Feed Intake per Bird (g)','Number of Eggs','Avg. Egg Weight (g)','Egg Production Rate (%)',
    'Feed to Egg Ratio','H5N1 (Killed) (Before Day)','H9N2 / H9N2 + ND (Before Day)','Deworming (Before Day)','Coryza / Salmonella (Before Day)','Live Vaccine (ND / ND+IB) (Before Day)','Other Vaccine (Name + Day)','Previous Medicine Used','Problem & Comment','Suggested Medicine','From Which Dealer'];
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Layer');
  ws.columns = headers.map(h => ({header: h, width: Math.max(13, Math.min(h.length + 3, 30))}));
  const border = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
  const hr = ws.getRow(1);
  hr.height = 34;
  hr.eachCell(c => {
    c.font = {bold: true};
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFFBE3CF'}};
    c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
    c.border = border;
  });
  const groups = new Map();
  list.forEach(x => { if (!groups.has(x.f.id)) groups.set(x.f.id, {f: x.f, items: []}); groups.get(x.f.id).items.push(x); });
  for (const g of groups.values()){
    const sheds = g.f.sheds || [];
    g.items.sort((a,b) => (sheds.indexOf(shedOf(a.v)) - sheds.indexOf(shedOf(b.v))) || (a.v.date||'').localeCompare(b.v.date||''));
    const start = ws.rowCount + 1;
    g.items.forEach(({v,c}) => {
      const info = shedInfoOf(g.f, shedOf(v));
      ws.addRow(['', '', '', '', shedOf(v), info.chickBrand, info.breed,
        fmtDMY(v.date), wk2(num(v.ageWeeks)), num(v.chicks), num(v.mortality), num(v.bodyWeight),
        num(v.totalFeed), num(v.dailyFeed),
        c.avgFeed == null ? '' : +c.avgFeed.toFixed(1), num(v.eggs), num(v.eggWeight),
        c.rate == null ? '' : +c.rate.toFixed(2),
        c.ratio == null ? '' : +c.ratio.toFixed(2),
        v.h5n1, v.h9n2, v.deworming, v.karyza, v.ndOblique, v.otherVaccine, v.prevMedicine ?? v.medicine, v.problem, v.suggestedMedicine, v.dealer]);
    });
    const end = ws.rowCount;
    for (let r = start; r <= end; r++){
      ws.getRow(r).eachCell({includeEmpty: true}, c => {
        c.border = border;
        c.alignment = {horizontal:'center', vertical:'middle', wrapText:true};
      });
    }
    // farm details: merged down the whole farm
    [g.f.name, g.f.address, g.f.mobile, g.f.feedBrand].forEach((val, idx) => {
      if (end > start) ws.mergeCells(start, idx + 1, end, idx + 1);
      const cell = ws.getCell(start, idx + 1); cell.value = val || ''; cell.font = {bold: true};
    });
    // shed details: merged down each shed's rows
    let r = start;
    while (r <= end){
      const sh = ws.getRow(r).getCell(5).value;
      let e = r;
      while (e + 1 <= end && ws.getRow(e + 1).getCell(5).value === sh) e++;
      if (e > r) [5, 6, 7].forEach(col => ws.mergeCells(r, col, e, col));
      r = e + 1;
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  const u8 = new Uint8Array(buf);
  if (dl){
    try{ await dl.save({filename: name, data: u8}); }catch(e){ toast('Download cancelled or failed'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([u8], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

document.addEventListener('click', async e => {
