async function restoreTrashItem(id){
  const rec = (state.trash || []).find(x => x.id === id); if (!rec) return;
  if (rec.type === 'trash'){
    if (rec.kind === 'rx'){ await saveRxItem(clone(rec.payload)); }
    else { const obj = clone(rec.payload); delete obj.deletedAt; const k = state.farms.findIndex(x => x.id === obj.id); if (k >= 0) state.farms[k] = obj; else state.farms.push(obj); saveFarm(clone(obj)); }
    state.trash = state.trash.filter(x => x.id !== rec.id); purgeRecord(rec.id);
  } else {
    const obj = clone(rec); delete obj.deletedAt;
    state.trash = state.trash.filter(x => x.id !== obj.id); state.farms.push(obj); saveFarm(clone(obj));
  }
}
function purgeTrashItem(id){ state.trash = (state.trash || []).filter(x => x.id !== id); purgeRecord(id); }
async function handleClick(e){
  const nav = e.target.closest('[data-nav]');
  if (nav){ state.view = nav.dataset.nav; state.mode = 'list'; return render(); }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'savePin') return pinSave();
  if (act === 'photos' || act === 'brPhotos') return openPhotos(b.dataset.id);
  if (act === 'closePhotos'){ state.photoView = null; return render(); }
  if (act.startsWith('br')) return brClick(act, b);
  if (act === 'vsDownload') return vsDownload();
  if (act === 'mfView'){ state.mfView = !state.mfView; return render(); }
  if (act === 'lt'){ state.listTab = b.dataset.tab; return render(); }
  if (act === 'frAdd'){ state.fMode = 'new'; state.fForm = blankFarmer(); return render(); }
  if (act === 'frCancel'){ state.fMode = null; return render(); }
  if (act === 'frEdit'){
    const g = farmerGroups().find(x => x.key === b.dataset.key); if (!g) return;
    state.fMode = 'edit'; state.fForm = {name:g.name, address:g.address, mobile:g.mobile, types:g.types.slice(), cap:g.cap || '', dealer:g.dealer || '', key:g.key};
    return render();
  }
  if (act === 'frSave'){
    const f = state.fForm;
    if (blank_dl(f.name)) return toast('Enter the farmer name');
    const mob = String(f.mobile || '').replace(/\s+/g, '');
    const key = state.fMode === 'edit' && f.key ? f.key : (mob || 'farmer' + Date.now());
    if (state.fMode === 'new' && mob && farmerGroups().some(g => g.key === mob)) return toast('This mobile already exists. Use Edit on that farmer.');
    const id = 'farmer_' + key;
    const obj = {id, type:'farmer', name:String(f.name).trim(), address:f.address || '', mobile:mob, types:f.types || [], cap:f.cap || '', dealer:f.dealer || '', hidden:false};
    const i = state.farms.findIndex(x => x.id === id);
    if (i >= 0) state.farms[i] = obj; else state.farms.push(obj);
    state.fMode = null; saveFarm(clone(obj)); toast('Farmer saved'); return render();
  }
  if (act === 'frDel'){
    const g = farmerGroups().find(x => x.key === b.dataset.key); if (!g) return;
    const id = 'farmer_' + g.key;
    const before = state.farms.find(x => x.id === id);
    const payload = before ? clone(before) : {id, type:'farmer', name:g.name, address:g.address, mobile:g.mobile, types:g.types.slice(), cap:g.cap || '', dealer:g.dealer || '', hidden:false};
    addTrash('farmer', g.name, payload);
    const hide = {id, type:'farmer', name:g.name, mobile:g.mobile, hidden:true};
    const i = state.farms.findIndex(x => x.id === id);
    if (i >= 0) state.farms[i] = hide; else state.farms.push(hide);
    saveFarm(clone(hide)); toast('Farmer removed from the list'); return render();
  }
  if (act === 'frxl') return farmerXlsx();
  if (act === 'trRestore'){ await restoreTrashItem(b.dataset.id); toast('Restored'); return render(); }
  if (act === 'trPurge'){ purgeTrashItem(b.dataset.id); toast('Deleted for good'); return render(); }
  if (act === 'trSelRestore'){ const ids = Object.keys(state.trSel || {}); for (const id of ids) await restoreTrashItem(id); state.trSel = {}; toast('Restored ' + ids.length + ' item(s)'); return render(); }
  if (act === 'trSelPurge'){ const ids = Object.keys(state.trSel || {}); ids.forEach(id => purgeTrashItem(id)); state.trSel = {}; toast('Deleted ' + ids.length + ' item(s) for good'); return render(); }
  if (act === 'dlxl') return dealerXlsx();
  if (act === 'frxl') return farmerXlsx();
  if (act === 'dlFromVisit'){
    const obj = {id: 'dealer_' + Date.now(), type: 'dealer', ...blankDealer(), name: b.dataset.name};
    state.farms.push(obj); saveFarm(clone(obj)); toast('Dealer added. Complete the details in List → Dealer List.'); return render();
  }
  if (act === 'dlNew'){ state.dlMode = 'new'; state.dlForm = blankDealer(); return render(); }
  if (act === 'dlEdit'){ const d = state.farms.find(x => x.id === b.dataset.id); state.dlMode = d.id; state.dlForm = clone(d); return render(); }
  if (act === 'dlCancel'){ state.dlMode = null; return render(); }
  if (act === 'dlFeedAdd'){ state.dlForm = normDealer(state.dlForm); state.dlForm.feeds.push({brand:'', tons:''}); return render(); }
  if (act === 'dlFeedDel'){ state.dlForm = normDealer(state.dlForm); state.dlForm.feeds.splice(+b.dataset.i, 1); return render(); }
  if (act === 'dlSave'){
    const f = state.dlForm;
    if (blank_dl(f.name)) return toast('Enter the dealer name');
    const obj = state.dlMode === 'new' ? {id: 'dealer_' + Date.now(), type: 'dealer'} : {...state.farms.find(x => x.id === state.dlMode)};
    Object.assign(obj, f, {name: String(f.name || '').trim()});
    obj.feeds = (f.feeds || []).filter(x => !blank_dl(x.brand));
    delete obj.feedBrand;
    const i = state.farms.findIndex(x => x.id === obj.id);
    if (i >= 0) state.farms[i] = obj; else state.farms.push(obj);
    state.dlMode = null; saveFarm(clone(obj)); toast('Dealer saved'); return render();
  }
  if (act === 'dlDel'){ deleteFarm(b.dataset.id); return; }
  if (act === 'rpEdit'){ state.repEdit = !state.repEdit; return render(); }
  if (act === 'rpReset'){ state.reportText = null; return render(); }
  if (act === 'rpCopy'){
    const t = state.reportText != null ? state.reportText : reportTextFor(state.repDate);
    const done = () => toast('Report copied');
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); };
    if (navigator.clipboard) return navigator.clipboard.writeText(t).then(done).catch(fallback);
    return fallback();
  }
  if (act === 'rxOpen'){ if (!state.rx) rxNew(); state.view = 'rx'; return render(); }
  if (act === 'rxNew'){ rxNew(); return render(); }
  if (act === 'rxAdd'){ state.rx.meds.push(rxMed()); return render(); }
  if (act === 'rxDel'){ state.rx.meds.splice(+b.dataset.i, 1); return render(); }
  if (act === 'rxSave') return rxSave();
  if (act === 'rxPdf') return rxExport('pdf');
  if (act === 'rxImg') return rxExport('png');
  if (act === 'rxSend') return rxSend();
  if (act === 'rxView'){ state.rxView = !state.rxView; return render(); }
  if (act === 'rxOpen2'){ const it = state.rxList.find(x => x.id === b.dataset.p); if (it) state.rx = rxFromItem(it); state.view = 'rx'; return render(); }
  if (act === 'rxDelSaved'){ moveRxToTrash(b.dataset.p).then(() => toast('Prescription moved to Recycle Bin')).catch(err => toast('Delete failed: ' + err.message)); return render(); }
  if (act === 'mdDownload') return modelDownload();
  if (act === 'mdBrDownload') return brModelDownload('broiler');
  if (act === 'mdCbDownload') return brModelDownload('colorbird');
  if (act === 'mdEdit'){
    const f = state.farms.find(x => x.id === b.dataset.f), idx = +b.dataset.i;
    state.modelEdit = true;
    if (b.dataset.b){
      const bt = f.batches.find(x => x.id === b.dataset.b), v = bt.visits[idx];
      state.brFarmId = f.id; state.brBatchId = bt.id; state.brVisitIdx = idx; state.brAuto = false;
      state.brForm = clone(v); state.brForm.dateText = fmtDMY(v.date);
      state.brType = f.type; state.farmType = f.type; state.brmode = 'visitForm'; state.view = 'farm'; return render();
    }
    state.farmId = f.id; state.farmType = 'layer'; state.brType = 'layer';
    state.visitIdx = idx; state.form = clone(f.visits[idx]); state.form.dateText = fmtDMY(state.form.date); state.form.dailyAuto = false;
    state.mode = 'visitForm'; state.view = 'farm'; return render();
  }
  if (act === 'mdDelete'){
    const f = state.farms.find(x => x.id === b.dataset.f);
    if (b.dataset.b){ f.batches.find(x => x.id === b.dataset.b).visits.splice(+b.dataset.i, 1); }
    else f.visits.splice(+b.dataset.i, 1);
    saveFarm(clone(f)); toast('Row deleted'); return render();
  }
  if (act === 'tkEdit'){
    const f = state.farms.find(x => x.id === b.dataset.f), bt = b.dataset.b ? f.batches.find(x => x.id === b.dataset.b) : null;
    state.trackEdit = {kind: b.dataset.kind, farmId: f.id, batchId: bt ? bt.id : null};
    state.trackForm = clone(b.dataset.kind === 'layer' ? layerTrack(f) : brTrack(f, bt));
    return render();
  }
  if (act === 'tkCancel'){ state.trackEdit = null; return render(); }
  if (act === 'tkSave'){
    const te = state.trackEdit, f = state.farms.find(x => x.id === te.farmId);
    if (te.kind === 'layer') f.track = {...(f.track || {}), ...state.trackForm};
    else { const bt = f.batches.find(x => x.id === te.batchId); bt.track = {...(bt.track || {}), ...state.trackForm}; }
    saveFarm(clone(f)); state.trackEdit = null; toast('Saved'); return render();
  }
  if (act === 'tkDel'){
    const f = state.farms.find(x => x.id === b.dataset.f);
    const list = b.dataset.b ? f.batches.find(x => x.id === b.dataset.b).visits : f.visits;
    list.forEach(v => { if (isModelVisit(v)) v.model = 'No'; });
    saveFarm(clone(f)); toast('Removed from Model Farm (visits stay in the farm)'); return render();
  }
  if (act === 'type'){ state.farmType = b.dataset.type; state.brType = b.dataset.type; state.mode = 'list'; state.brmode = 'list'; return render(); }
  if (act === 'back'){ state.mode = (state.mode === 'visitForm' || (state.mode === 'farmForm' && state.farmId)) ? 'sheet' : 'list'; return render(); }
  if (act === 'newFarm'){ state.farmId = null; state.form = Object.fromEntries(FARM_FIELDS.map(([k]) => [k,''])); state.mode = 'farmForm'; return render(); }
  if (act === 'editFarm'){ const f = curFarm(); state.form = clone(f); state.mode = 'farmForm'; return render(); }
  if (act === 'openFarm'){ state.farmId = b.dataset.id; state.shedFilter = 'all'; state.mode = 'sheet'; return render(); }
  if (act === 'newVisit'){
    const f = curFarm(), last = f.visits[f.visits.length - 1] || {};
    state.visitIdx = null; state.photos = []; state.modelEdit = false;
    state.form = {id:null, shed: state.shedFilter !== 'all' ? state.shedFilter : (last.shed || ''), date:today(), dateText:fmtDMY(today()), ageWeeks:'', chicks:last.chicks||'', mortality:0, totalFeed:'', dailyAuto:true, dailyFeed:'', eggs:'', eggWeight:'',
                  deworming:'', h5n1:'', h9n2:'', h9nd:'', karyza:'', ndOblique:'', ntIb:'', otherVaccine:'', prevMedicine:'', problem:'No', suggestedMedicine:'', dealer:last.dealer||''};
    Object.assign(state.form, prefillFrom(lastVisitOf(f, state.form.shed)));
    layerGapFromDate();
    state.mode = 'visitForm'; return render();
  }
  if (act === 'editVisit'){ state.visitIdx = +b.dataset.i; state.form = clone(curFarm().visits[state.visitIdx]); state.form.dateText = fmtDMY(state.form.date); state.form.dailyAuto = false; state.mode = 'visitForm'; return render(); }
  if (act === 'delVisit'){
    const f = curFarm(); if (!f) return;
    const snapV = clone(f), vdV = f.visits[+b.dataset.i];
    f.visits.splice(+b.dataset.i, 1); state.mode = 'sheet';
    addTrash('visit', (f.name || 'Farm') + ' - ' + (vdV && vdV.date || ''), snapV);
    try{ await saveFarm(clone(f)); toast('Visit cancelled'); }catch(err){ toast(err.message); }
    return render();
  }
  if (act === 'saveFarm'){
    const form = state.form;
    if (!Object.values(form).some(x => String(x ?? '').trim() !== '')) return toast('Enter at least one farm detail');
    if (!state.farmId){
      const mk = String(form.mobile || '').replace(/\s/g, '');
      const ex = mk && state.farms.find(x => ['layer','broiler','colorbird'].includes(x.type) && String(x.mobile || '').replace(/\s/g, '') === mk);
      if (ex){ toast('This mobile already exists: ' + ex.name + '. Opened the existing farm.'); state.farmId = ex.id; state.mode = 'sheet'; return render(); }
    }
    let f = state.farmId ? curFarm() : null;
    if (f){ FARM_FIELDS.forEach(([k]) => f[k] = form[k]); }
    else { f = {id:'farm_'+Date.now(), type:'layer', ...form, visits:[]}; state.farms.push(f); state.farmId = f.id; }
    try{ await saveFarm(clone(f)); toast('Farm saved'); }catch(err){ toast(err.message); }
    state.mode = 'sheet'; return render();
  }
  if (act === 'saveVisit'){
    const f = curFarm(), v = clone(state.form);
    if (!v.date){ v.date = today(); v.dateText = fmtDMY(v.date); }
    if (!v.id) v.id = 'v' + Date.now();
    if (v.ageSrc === 'ageWeeks' && !blank_dl(v.ageWeeks)) v.ageDays = String(Math.round(Number(v.ageWeeks) * 7));
    if (!blank_dl(v.ageDays)) v.ageWeeks = String(Math.round(Number(v.ageDays) / 7 * 100) / 100);
    applyShedInfo(f, v);
    if (state.visitIdx == null) f.visits.push(v); else f.visits[state.visitIdx] = v;
    normaliseVisits(f);
    try{ await saveFarm(clone(f)); toast('Visit saved'); }catch(err){ toast(err.message); }
    uploadPending(f, v);
    state.mode = 'sheet'; return render();
  }
  if (act === 'askDelFarm'){ state.pendingFarmDel = b.dataset.id; return render(); }
  if (act === 'cancelDel'){ state.pendingFarmDel = null; return render(); }
  if (act === 'confirmDelFarm'){ return deleteFarm(b.dataset.id); }
  if (act === 'sumAll'){ state.sumMonth = ''; return render(); }
  if (act === 'dlMonth'){ const m = state.sumMonth; return download(allVisits(state.filterFarm, m, 'layer'), `layer_visits_${m || 'all'}.xlsx`); }
  if (act === 'dlAll'){ return download(allVisits(state.filterFarm, '', 'layer'), 'layer_visits_all.xlsx'); }
  if (act === 'dlFarm'){ const f = curFarm(); return download(allVisits(f.id, '', 'layer'), `${(f.name||'farm').replace(/\W+/g,'_')}_visits.xlsx`); }
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'brSearch'){ state.brSearch = t.value; const el = document.getElementById('brList'); if (el) el.innerHTML = brRowsHTML(); return; }
  if (t.dataset.tk !== undefined){ state.trackForm[t.dataset.tk] = t.value; return; }
  if (t.id === 'repText'){ state.reportText = t.value; return; }
  if (t.dataset.dl !== undefined){ state.dlForm[t.dataset.dl] = t.value; return; }
  if (t.id === 'frSearch'){ state.fSearch = t.value; const el = document.getElementById('frTable'); if (el) el.innerHTML = farmerTableHTML(); return; }
  if (t.dataset.fr !== undefined){ state.fForm[t.dataset.fr] = t.value; return; }
  if (t.dataset.dlfeed !== undefined){ const [fi, fk] = t.dataset.dlfeed.split(':'); state.dlForm.feeds[+fi][fk] = t.value; return; }
  if (t.dataset.rxm !== undefined){
    const m = state.rx.meds[+t.dataset.i]; m[t.dataset.rxm] = t.dataset.rxm === 'vacc' ? t.value === 'yes' : t.value;
    if (t.dataset.rxm === 'perUnit'){ const route = t.value === 'liter' ? 'water' : 'feed'; m.route = route;
      const rs = document.querySelector(`[data-rxm="route"][data-i="${t.dataset.i}"]`); if (rs) rs.value = route; }
    if (t.dataset.rxm === 'vacc' || (t.dataset.rxm === 'route' && m.vacc)){ render(); return; }
    rxRefresh(); return;
  }
  if (t.dataset.rx !== undefined){ state.rx[t.dataset.rx] = t.value; if (t.dataset.rx === 'date' && parseDMY(t.value)) state.rx.iso = parseDMY(t.value); rxRefresh(); return; }
  if (t.dataset.brf !== undefined || t.dataset.brb !== undefined){ state.brForm[t.dataset.brf ?? t.dataset.brb] = t.value; return; }
  if (t.dataset.brv !== undefined){
    const k = t.dataset.brv, form = state.brForm; form[k] = t.value;
    const setField = (key, val) => { form[key] = val; const el = document.querySelector(`[data-brv="${key}"]`); if (el && el !== t) el.value = val; };
    if (k === 'dateText'){ form.date = parseDMY(t.value); if (form.date) brGapFromDate(); }
    if (k === 'gapDays') brGapFromGap();
    // bags and kg always follow each other (1 bag = 50 kg), in both new and edit forms
    if (k === 'totalBag'){ const bags = num(t.value); setField('totalKg', bags == null ? '' : String(+(bags * 50).toFixed(2))); }
    if (k === 'totalKg'){ const kg = num(t.value); setField('totalBag', kg == null ? '' : String(+(kg / 50).toFixed(3))); }
    brUpdatePreview(); return;
  }
  if (t.dataset.fk !== undefined){ state.form[t.dataset.fk] = t.value; }
  else if (t.dataset.vk !== undefined){
    const k = t.dataset.vk; state.form[k] = t.value;
    /* 7 days = 1 week: typing days fills weeks (2 decimals), typing weeks fills days (x 7) */
    if (k === 'ageDays' || k === 'ageWeeks'){
      state.form.ageSrc = k;
      const days = k === 'ageDays', src = Number(t.value);
      const other = days ? 'ageWeeks' : 'ageDays';
      const val = (t.value === '' || isNaN(src)) ? '' : (days ? (Math.round(src / 7 * 100) / 100) : Math.round(src * 7));
      state.form[other] = val === '' ? '' : String(val);
      const el = document.querySelector(`[data-vk="${other}"]`);
      if (el) el.value = state.form[other];
      if (days) state.form.ageWeeks = state.form[other];
      return;
    }
    /* 1 bag = 50 kg: typing kg fills bags, typing bags fills kg (2 decimals) */
    if (k === 'dailyFeed' || k === 'totalFeed'){
      const val = num(t.value), other = k === 'dailyFeed' ? 'totalFeed' : 'dailyFeed';
      const conv = val == null ? '' : (k === 'dailyFeed' ? String(+(val / 50).toFixed(2)) : String(+(val * 50).toFixed(2)));
      state.form[other] = conv;
      const el = document.querySelector(`[data-vk="${other}"]`); if (el) el.value = conv;
    }
    if (k === 'dateText'){ state.form.date = parseDMY(t.value); if (state.form.date) layerGapFromDate(); }
    if (k === 'gapDays') layerGapFromGap();
    if (k === 'dailyFeed') state.form.dailyAuto = false;
    if (k === 'totalFeed' && state.form.dailyAuto !== false){
      const bags = num(t.value);
      state.form.dailyFeed = bags == null ? '' : String(bags * 50);
      const di = document.querySelector('[data-vk="dailyFeed"]'); if (di) di.value = state.form.dailyFeed;
    }
    updatePreview();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.mf !== undefined){ state.mf[t.dataset.mf] = t.value; return render(); }
  if (t.dataset.frtype !== undefined){ const ty = t.dataset.frtype; const a = state.fForm.types; state.fForm.types = t.checked ? [...new Set([...a, ty])] : a.filter(x => x !== ty); return; }
  if (t.dataset.fr !== undefined){ state.fForm[t.dataset.fr] = t.value; return; }
  if (t.dataset.trall !== undefined){ state.trSel = {}; if (t.checked) (state.trash || []).forEach(x => { state.trSel[x.id] = true; }); return render(); }
  if (t.dataset.trsel !== undefined){ if (t.checked) state.trSel[t.dataset.trsel] = true; else delete state.trSel[t.dataset.trsel]; return render(); }
  if (t.dataset.brmodel !== undefined){
    const f = state.farms.find(x => x.id === (t.dataset.brf || (brFarmOf() || {}).id)); const bt = f && (f.batches || []).find(x => x.id === t.dataset.brmodel);
    if (bt){ bt.noModel = !t.checked; saveFarm(clone(f)); render(); }
    return;
  }
  if (t.dataset.brshed !== undefined){
    const f = state.farms.find(x => x.id === t.dataset.brf);
    if (f){ (f.batches || []).forEach(x => { if ((x.shed || '') === t.dataset.brshed) x.noModel = !t.checked; }); saveFarm(clone(f)); render(); }
    return;
  }
  if (t.dataset.mdpick !== undefined){ state.mdPick[t.dataset.mdpick] = t.checked; return; }
  if (t.dataset.rpdate !== undefined){ state.repDate = t.value; state.reportText = null; return render(); }
  if (t.dataset.rxsel !== undefined){ rxPickFarm(t.value); return render(); }
  if (t.dataset.logo !== undefined){
    const file = t.files && t.files[0];
    if (file){ const rd = new FileReader(); rd.onload = () => { state.rxLogo = rd.result; localStorage.setItem('rxLogo', rd.result); rxRefresh(); toast('Logo added to the pad'); }; rd.readAsDataURL(file); }
    return;
  }
  if (t.dataset.rxmt !== undefined){
    const m = state.rx.meds[+t.dataset.i]; m.slots = m.slots || [];
    const k = t.dataset.rxmt, has = m.slots.includes(k);
    if (t.checked && !has) m.slots.push(k);
    if (!t.checked && has) m.slots = m.slots.filter(x => x !== k);
    rxRefresh(); return;
  }
  if (t.dataset.ftype !== undefined){ state.farmType = t.value; state.brType = t.value; state.mode = 'list'; state.brmode = 'list'; return render(); }
  if (t.dataset.photo !== undefined){ readPhotos(Array.from(t.files || [])); return; }
  if (t.dataset.vs !== undefined){ state.vs[t.dataset.vs] = t.value; return render(); }
  if (t.dataset.brstatus !== undefined){
    const f = brFarmOf(), batch = (f.batches || []).find(x => x.id === t.dataset.brstatus);
    batch.status = t.value; saveFarm(clone(f)); toast('Batch status: ' + t.value); return render();
  }
  if (t.id === 'brShowDone'){ state.brShowDone = t.checked; return render(); }
  if (t.dataset.vk === 'shed' && state.mode === 'visitForm'){
    const f = curFarm(), sh = shedOf({shed: t.value}), si = f && f.shedInfo && f.shedInfo[sh];
    if (si){ state.form.chickBrand = si.chickBrand; state.form.breed = si.breed; }
    const lv = lastVisitOf(f, sh);
    if (f && lv.date) Object.assign(state.form, prefillFrom(lv));
    state.form.shed = sh;
    return render();
  }
  if (t.dataset.vk === 'dateText' && state.mode === 'visitForm' && state.visitIdx == null && state.form.date){ return autoSaveVisit(); }
  if (t.id === 'shedFilter'){ state.shedFilter = t.value; return render(); }
  if (t.id === 'listFilter'){ state.listFilter = t.value; return render(); }
  if (t.id === 'sumMonth'){ state.sumMonth = t.value; return render(); }
  if (t.id === 'filterFarm'){ state.filterFarm = t.value; return render(); }
});

function autoSaveVisit(){
  const f = curFarm(); if (!f) return;
  const v = clone(state.form); v.id = 'v' + Date.now();
  applyShedInfo(f, v);
  f.visits.push(v);
  normaliseVisits(f);
  state.visitIdx = f.visits.findIndex(x => x.id === v.id);
  state.form.id = v.id;
  saveFarm(clone(f));
  toast('Date saved. Fill in the other details and press Save Visit.');
  render();
}

/* ---------- Start ---------- */
(async () => {
  try{ await initBackends(); }catch(e){}
  await loadAll();
  state.rxList = await loadRx();
  state.rxLogo = localStorage.getItem('rxLogo') || '';
  for (const f of state.farms) for (const p of (f.prescriptions || [])) if (!state.rxList.some(x => x.id === p.id)){ const it = {...p.data, id: p.id, farmId: f.id}; state.rxList.push(it); if (store.kind === 'db') saveRxItem(it).catch(() => {}); }
  localStorage.setItem('rxList', JSON.stringify(state.rxList));
  try{ void 0; }
  catch(e){ state.farms = []; }
  try{ render(); }
  catch(e){ app.innerHTML = '<p class="muted">Display error: ' + esc(e.message) + '</p>'; }
})();
</script>
